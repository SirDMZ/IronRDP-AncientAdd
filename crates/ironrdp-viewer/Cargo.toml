[package]
name = "ironrdp-viewer"
version = "0.1.0"
readme = "README.md"
description = "Portable RDP viewer (GUI binary) without GPU acceleration"
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
default-run = "ironrdp-viewer"

[lib]
doctest = false
test = false

[[bin]]
name = "ironrdp-viewer"
test = false

[features]
default = ["rustls", "sound"]
rustls = ["ironrdp/rustls", "ironrdp-daemon/rustls"]
# Pure-Rust rustls (RustCrypto provider). Build a C-toolchain-free viewer with
# `--no-default-features --features rustls-rustcrypto` (drops audio's bundled libopus
# and the aws-lc-rs crypto provider — no CMake/NASM required).
rustls-rustcrypto = ["ironrdp/rustls-rustcrypto", "ironrdp-daemon/rustls-rustcrypto"]
native-tls = ["ironrdp/native-tls", "ironrdp-daemon/native-tls"]
# Audio output/input redirection. On by default, but it pulls in a bundled libopus
# built via CMake; disable it (`--no-default-features --features rustls`) to build
# without a CMake/C toolchain when audio is not needed.
sound = ["ironrdp/client-sound"]
qoi = ["ironrdp/qoi"]
qoiz = ["ironrdp/qoiz"]

[dependencies]
# `default-features = false` so the viewer's TLS-backend features drive the daemon's
# backend (otherwise its default `rustls`/aws-lc-rs would always be pulled in).
ironrdp-daemon = { path = "../ironrdp-daemon", version = "0.1", default-features = false } # public
ironrdp-rpc = { path = "../ironrdp-rpc", version = "0.1" }
# `client-all` minus `client-sound`, which is gated behind this crate's optional
# `sound` feature above (audio pulls in a CMake-built libopus).
ironrdp = { path = "../ironrdp", version = "0.17", features = [
    "connector",
    "cliprdr",
    "input",
    "pdu",
    "graphics",
    "client",
    "client-clipboard",
    "client-rdpdr",
    "client-smartcard",
    "client-gateway",
    "client-gateway-rpc",
    "client-dvc-pipe-proxy",
    "client-dvc-com-plugin",
    "client-webauthn",
    "client-vmconnect",
] }
ironrdp-cfg = { path = "../ironrdp-cfg", version = "0.1" }
ironrdp-propertyset = { path = "../ironrdp-propertyset", version = "0.1" }
ironrdp-rdpfile = { path = "../ironrdp-rdpfile", version = "0.1" }

# Windowing and rendering
winit = { version = "0.30", features = ["rwh_06"] }
softbuffer = "0.4"

# CLI
clap = { version = "4.6", features = ["derive", "cargo", "env"] }
inquire = "0.9"
proc-exit = "2"

# Logging
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async, futures
tokio = { version = "1", features = ["full"] }

# Utils
whoami = "2.1"
anyhow = "1"
smallvec = "1.15"
tap = "1"
semver = "1"
raw-window-handle = "0.6"
url = "2"

[target.'cfg(windows)'.dependencies]
ironrdp-rdpdr-native = { path = "../ironrdp-rdpdr-native", version = "0.7" }

[lints]
workspace = true
