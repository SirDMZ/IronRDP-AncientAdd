[package]
name = "ironrdp-daemon"
version = "0.1.0"
publish = false
readme = "README.md"
description = "Reusable persistent RDP session daemon support"
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# TLS backend, forwarded to ironrdp-client. Defaults to `rustls` (aws-lc-rs) to
# preserve the previous always-on behavior for standalone consumers; a downstream
# that wants a C-free build depends on this crate with `default-features = false`
# and selects `rustls-rustcrypto` (or `native-tls`) instead.
default = ["rustls"]
rustls = ["ironrdp-client/rustls"]
rustls-rustcrypto = ["ironrdp-client/rustls-rustcrypto"]
native-tls = ["ironrdp-client/native-tls"]

[dependencies]
# TLS backend is chosen via this crate's own features above, not hardcoded here.
ironrdp-client = { path = "../ironrdp-client", version = "0.1", features = ["dvc-pipe-proxy", "rdpdr", "smartcard"] } # public
ironrdp-cfg = { path = "../ironrdp-cfg", version = "0.1" }
ironrdp-input = { path = "../ironrdp-input", version = "0.7" }
ironrdp-pdu = { path = "../ironrdp-pdu", version = "0.9" }
ironrdp-propertyset = { path = "../ironrdp-propertyset", version = "0.1" } # public
ironrdp-rpc = { path = "../ironrdp-rpc", version = "0.1" } # public
ironrdp-tls = { path = "../ironrdp-tls", version = "0.2" }
anyhow = "1"
now-client = "0.1.0"
png = "0.18"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros", "io-util", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
whoami = "2.1"
ironrdp-rail = { version = "0.1.0", path = "../ironrdp-rail" }

[dev-dependencies]
ironrdp-connector = { path = "../ironrdp-connector" }
now-proto-pdu = { version = "0.4", features = ["std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# WebAuthn redirection is Windows-only (webauthn.dll / WebAuthN* APIs).
ironrdp-client = { path = "../ironrdp-client", version = "0.1", features = ["webauthn"] }
ironrdp-rdpdr-native = { path = "../ironrdp-rdpdr-native", version = "0.7" }

[lints]
workspace = true

